<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>正在加载 DeepSeek Harness</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --fg: #1f2328;
      --muted: #57606a;
      --accent: #0969da;
      --card: #ffffff;
      --border: #d0d7de;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      /* Prevent any scrollbar from appearing/shifting the centered card at
         startup (WebView2 first-paint can briefly overflow). */
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    /* Grid centering is stable against first-paint viewport quirks and keeps
       the card pinned to the true center while the webview settles. */
    body {
      display: grid;
      place-items: center;
    }
    .card {
      text-align: center;
      padding: 48px 56px;
      max-width: 420px;
      /* 启动时先隐藏卡片:窗口由 Rust 侧以“创建即最大化”方式显示(无最大化
         过渡)，等首帧绘制完成后由 JS setTimeout 再淡入，避免启动瞬间
         loading 内容跟着窗口一起闪烁。 */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease;
    }
    .card.visible { opacity: 1; visibility: visible; }
    h1 { font-size: 20px; margin: 20px 0 8px; letter-spacing: 0.3px; }
    p#status { color: var(--muted); font-size: 14px; margin: 0; }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error { margin-top: 24px; text-align: left; font-size: 13px; }
    #error h2 { font-size: 14px; margin: 0 0 8px; color: #cf222e; }
    #error ul { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.8; }
    #error code { background: rgba(27, 31, 35, 0.08); padding: 1px 5px; border-radius: 4px; }
    #error a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <p id="status"></p>
    <div id="error" hidden>
      <h2>无法启动 DeepSeek Harness 服务</h2>
      <ul>
        <li>请确认已安装 <a href="https://nodejs.org/zh-cn" target="_blank" rel="noreferrer">Node.js</a></li>
        <li>请确认已安装 dsh:<code>npm install -g @deepseek-ai/dsh</code></li>
        <li>请确认端口 3080 未被其他程序占用</li>
      </ul>
    </div>
  </div>
  <script>
    // 正常启动时由 Rust 侧负责拉起服务器并导航到目标页面；此处仅做兜底:
    // 若 20 秒后仍未离开本页(服务器未就绪/导航失败)，显示引导提示。
    // 由 "更多" -> "关闭 dsh" 导航到本页时带 mode=stopped:显示已停止状态。
    var card = document.getElementById("card");
    var stopped = new URLSearchParams(location.search).get("mode") === "stopped";
    if (stopped) {
      document.querySelector(".spinner").style.display = "none";
      document.getElementById("status").textContent = "dsh 服务已停止";
      card.classList.add("visible");
    } else {
      // 窗口由 Rust 侧以“创建即最大化”方式显示(无最大化过渡过程)，这里只
      // 等约 100ms 让首帧绘制完成再淡入卡片，避免启动瞬间 loading 内容
      // 跟着窗口一起闪烁。
      setTimeout(() => { card.classList.add("visible"); }, 100);
      setTimeout(() => {
        document.getElementById("error").hidden = false;
        document.getElementById("status").textContent = "服务未就绪";
      }, 20000);
    }
  </script>
</body>
</html>
