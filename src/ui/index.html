<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Title Bar</title>
  <style>
    :root {
      --bar: #f6f8fa;
      --fg: #1f2328;
      --muted: #57606a;
      --accent: #0969da;
      --accent-hover: #0a5fc0;
      --border: #d0d7de;
      --hover: rgba(31, 35, 40, 0.07);
      --active-bg: rgba(9, 105, 218, 0.10);
      --active-border: rgba(9, 105, 218, 0.35);
      --danger: #cf222e;
      --card: #ffffff;
      --shadow: rgba(31, 35, 40, 0.20);
    }
    /* Dark palette, applied by the Rust side via data-dsh-theme on <html> */
    html[data-dsh-theme="dark"] {
      --bar: #161b22;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --border: #30363d;
      --hover: rgba(230, 237, 243, 0.08);
      --active-bg: rgba(88, 166, 255, 0.15);
      --active-border: rgba(88, 166, 255, 0.40);
      --danger: #f85149;
      --card: #0d1117;
      --shadow: rgba(0, 0, 0, 0.50);
    }
    html[data-dsh-theme="dark"] #settings-backdrop {
      background: rgba(0, 0, 0, 0.50);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* Transparent page background: the bar webview is stretched over the
       content area while the settings popup is open, so the page must let
       the content show through (the 44px #bar strip below stays opaque). */
    html, body {
      background: transparent;
      color: var(--fg);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ---- title bar strip (44px) ---- */
    #bar {
      position: relative;
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 0 0 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bar);
    }
    /* centered nav group: Chat, Harness, More(⋮) */
    .nav {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .nav button {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .nav button:hover { background: var(--hover); color: var(--fg); }
    .nav button.active {
      background: var(--active-bg);
      border-color: var(--active-border);
      color: var(--accent);
      font-weight: 600;
    }
    #btn-more {
      width: 28px;
      height: 28px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---- window controls: uniform 46x44, flush to the right edge ---- */
    .win-controls {
      margin-left: auto;
      display: flex;
      height: 44px;
    }
    .win-controls button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      width: 46px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .win-controls button:hover { background: var(--hover); color: var(--fg); }
    .win-controls button.close:hover { background: #e81123; color: #fff; }

    /* ---- settings popup (bar webview expands over content while open) ---- */
    #settings-backdrop {
      position: fixed;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(31, 35, 40, 0.28);
      z-index: 25;
      /* Fade in only after the bar webview has grown; see openSettings() */
      opacity: 0;
      transition: opacity 0.16s ease;
    }
    #settings-backdrop.visible { opacity: 1; }
    #settings-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -46%) scale(0.97);
      width: min(540px, calc(100vw - 48px));
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 32px var(--shadow);
      z-index: 30;
      padding: 14px 20px 18px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #settings-modal.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    /* `display: flex` above would otherwise defeat the hidden attribute */
    #settings-modal[hidden] { display: none; }
    .sm-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .sm-head h2 {
      margin: 0;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sm-head h2 svg { color: var(--accent); flex: none; }
    #settings-close {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      width: 26px;
      height: 26px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #settings-close:hover { background: var(--hover); color: var(--fg); }
    /* two-pane layout: left tabs / right content */
    .sm-body {
      flex: 1 1 auto;
      min-height: 150px;
      display: flex;
      gap: 14px;
    }
    .sm-tabs {
      flex: none;
      width: 118px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-right: 12px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }
    .sm-tab {
      appearance: none;
      border: 0;
      background: transparent;
      text-align: left;
      font-size: 13px;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .sm-tab:hover { background: var(--hover); color: var(--fg); }
    .sm-tab.active {
      background: var(--active-bg);
      color: var(--accent);
      font-weight: 600;
    }
    .sm-panels {
      flex: 1 1 auto;
      min-width: 0;
      overflow-y: auto;
    }
    .sm-panel { display: none; }
    .sm-panel.active { display: block; }
    .opt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 2px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--fg);
    }
    .opt-row:hover { background: var(--hover); }
    .opt-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      flex: none;
    }
    /* segmented control (theme selector) */
    .seg {
      display: flex;
      flex: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .seg button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .seg button:hover { background: var(--hover); color: var(--fg); }
    .seg button.active {
      background: var(--active-bg);
      color: var(--accent);
      font-weight: 600;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 600;
      margin: 2px 0 10px;
    }
    .panel-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 12px;
      line-height: 1.5;
    }
    .sm-action {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      margin: 2px 0 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--fg);
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    .sm-action:hover:not(:disabled) { background: var(--hover); }
    .sm-action.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .sm-action.primary:hover:not(:disabled) { background: var(--accent-hover); }
    .sm-action:disabled { opacity: 0.5; cursor: default; }

    /* ---- transient toast (top-right, shown by expanding the bar a bit) ---- */
    #toast {
      position: fixed;
      top: 52px;
      right: 12px;
      max-width: min(380px, calc(100vw - 24px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px var(--shadow);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--fg);
      line-height: 1.5;
      z-index: 40;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      cursor: pointer;
    }
    #toast.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

    /* ---- about section inside the settings popup ---- */
    .about-row {
      font-size: 13px;
      margin-bottom: 8px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .about-row span.value { font-weight: 600; }
    #about-status, #dsh-status {
      font-size: 13px;
      line-height: 1.5;
      min-height: 20px;
      margin-bottom: 6px;
      color: var(--fg);
      white-space: pre-wrap;
    }
    #about-notes {
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bar);
      padding: 10px 12px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--fg);
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .about-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-bottom: 4px;
    }
    .about-actions button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .about-actions button:hover:not(:disabled) { background: var(--hover); }
    .about-actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .about-actions button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    .about-actions button:disabled { opacity: 0.5; cursor: default; }

    /* repo link inside the about section */
    .about-row a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }
    .about-row a:hover { text-decoration: underline; }

    /* ---- update progress bar (dsh + app panels) ---- */
    #about-progress, #dsh-progress {
      display: none;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    #about-progress.visible, #dsh-progress.visible { display: block; }
    #about-progress-fill, #dsh-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.2s ease;
    }
    /* indeterminate mode: a short segment sliding across the track */
    #about-progress.indeterminate #about-progress-fill,
    #dsh-progress.indeterminate #dsh-progress-fill {
      width: 40%;
      animation: about-progress-slide 1.1s ease-in-out infinite;
    }
    @keyframes about-progress-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="bar" data-tauri-drag-region="deep">
    <div class="nav" data-tauri-drag-region="false">
      <button id="btn-chat">Chat</button>
      <button id="btn-harness" class="active">Harness</button>
      <button id="btn-more" title="更多" aria-label="更多">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <circle cx="8" cy="3.4" r="1.5" />
          <circle cx="8" cy="8" r="1.5" />
          <circle cx="8" cy="12.6" r="1.5" />
        </svg>
      </button>
    </div>
    <div class="win-controls" data-tauri-drag-region="false">
      <button id="btn-min" title="最小化" aria-label="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M1.5 6h9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
        </svg>
      </button>
      <button id="btn-max" title="最大化" aria-label="最大化">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <rect x="2" y="2" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.1" />
        </svg>
      </button>
      <button id="btn-close" class="close" title="关闭" aria-label="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.4 2.4l7.2 7.2M9.6 2.4l-7.2 7.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>

  <!-- settings popup (only visible while the bar webview is expanded) -->
  <div id="settings-backdrop" hidden></div>
  <div id="settings-modal" hidden>
    <div class="sm-head">
      <h2>
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="8" r="2.5" />
          <path d="M8 1.9v1.5M8 12.6v1.5M1.9 8h1.5M12.6 8h1.5M3.7 3.7l1.05 1.05M11.25 11.25l1.05 1.05M12.3 3.7l-1.05 1.05M4.75 11.25l-1.05 1.05" />
        </svg>
        设置
      </h2>
      <button id="settings-close" title="关闭" aria-label="关闭">✕</button>
    </div>

    <div class="sm-body">
      <div class="sm-tabs">
        <button class="sm-tab active" data-tab="settings">设置</button>
        <button class="sm-tab" data-tab="update">更新 dsh</button>
        <button class="sm-tab" data-tab="about">关于</button>
      </div>
      <div class="sm-panels">
        <div class="sm-panel active" data-panel="settings">
          <div class="panel-title">设置</div>
          <label class="opt-row">
            <span class="opt-label">关闭窗口时关闭 dsh 服务</span>
            <input type="checkbox" id="opt-close-dsh" />
          </label>
          <label class="opt-row">
            <span class="opt-label">自动更新</span>
            <input type="checkbox" id="opt-auto-update" />
          </label>
          <div class="opt-row">
            <span class="opt-label">主题</span>
            <div class="seg" id="theme-seg">
              <button type="button" data-theme="light">浅色</button>
              <button type="button" data-theme="dark">深色</button>
              <button type="button" data-theme="system" class="active">跟随系统</button>
            </div>
          </div>
        </div>

        <div class="sm-panel" data-panel="update">
          <div class="panel-title">更新 dsh</div>
          <button id="menu-update" class="sm-action primary">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
              <path d="M8 12V3" />
              <path d="M4.5 6.5 8 3l3.5 3.5" />
              <path d="M3 13h10" />
            </svg>
            更新 dsh
          </button>
          <div class="panel-hint">检查并更新全局 @deepseek-ai/dsh（npm），更新完成后自动重启服务。</div>
          <div id="dsh-status"></div>
          <div id="dsh-progress"><div id="dsh-progress-fill"></div></div>
        </div>

        <div class="sm-panel" data-panel="about">
          <div class="panel-title">关于</div>
          <div class="about-row">当前版本:<span class="value" id="about-current">…</span></div>
          <div class="about-row">仓库:<a id="about-repo" href="#">…</a></div>
          <div id="about-status"></div>
          <div id="about-progress"><div id="about-progress-fill"></div></div>
          <div id="about-notes" hidden></div>
          <div class="about-actions">
            <button id="about-check" class="primary">检查更新</button>
            <button id="about-update" disabled>更新</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- transient toast -->
  <div id="toast"></div>

  <script>
    // Keep the single title bar's active-button highlight in sync. Called on
    // load and by the Rust side (bar.eval("setActive('...')")) after a switch.
    function setActive(target) {
      var h = document.getElementById("btn-harness");
      var c = document.getElementById("btn-chat");
      if (h) h.classList.toggle("active", target === "harness");
      if (c) c.classList.toggle("active", target === "chat");
    }

    // Show a transient toast. Called by the Rust side
    // (bar.eval("showToast('...')")) after operations complete; expands the
    // bar webview a little so the card renders below the 44px strip, then
    // auto-dismisses and shrinks it back. While the settings popup is open
    // (bar already expanded to the full window) the bar is left untouched.
    function showToast(text, ms) {
      var el = document.getElementById("toast");
      var dur = ms || 3500;
      if (!el) return;
      el.textContent = text;
      el.classList.add("visible");
      var T = window.__TAURI__;
      var expanded = !!window.__settingsOpen;
      if (T && !expanded) T.core.invoke("set_bar_height", { height: 150 });
      if (window.__toastTimer) clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () {
        el.classList.remove("visible");
        if (T && !expanded) T.core.invoke("set_bar_height", { height: 44 });
      }, dur);
    }

    (function () {
      var T = window.__TAURI__;
      if (!T) return;
      // 初始高亮:标题栏 webview 由 Rust 注入 window.__DSH_TARGET__(现恒为 harness)
      setActive(window.__DSH_TARGET__ || "harness");

      function invoke(cmd, args) { return T.core.invoke(cmd, args || {}); }
      var win = T.window.getCurrentWindow();

      // ---- settings popup (replaces the old 更多 dropdown + about dialog) ----
      var settingsOpen = false;
      window.__settingsOpen = false; // read by showToast to avoid resizing
      // Pending popup reveal: the popup is shown only after the bar webview
      // has actually grown to full height (see openSettings/revealSettings).
      var settingsRevealTimer = null;
      var settingsRevealHandler = null;

      function cancelSettingsReveal() {
        if (settingsRevealTimer) { clearTimeout(settingsRevealTimer); settingsRevealTimer = null; }
        if (settingsRevealHandler) {
          window.removeEventListener("resize", settingsRevealHandler);
          settingsRevealHandler = null;
        }
      }

      // Make the popup visible and fade it in. Revealing earlier — while the
      // bar webview is still 44px tall — paints the modal clipped at the top
      // for a frame or two and then jumps it to center (the open "flash").
      function revealSettings() {
        cancelSettingsReveal();
        var b = document.getElementById("settings-backdrop");
        var m = document.getElementById("settings-modal");
        b.hidden = false;
        m.hidden = false;
        // Add .visible next frame so the opacity/transform transition runs
        // from the start state instead of being batched into one paint.
        requestAnimationFrame(function () {
          b.classList.add("visible");
          m.classList.add("visible");
        });
      }

      function hideToast() {
        var el = document.getElementById("toast");
        if (window.__toastTimer) clearTimeout(window.__toastTimer);
        if (el) el.classList.remove("visible");
        if (!settingsOpen) invoke("set_bar_height", { height: 44 });
      }
      function closeSettings() {
        cancelSettingsReveal();
        settingsOpen = false;
        window.__settingsOpen = false;
        var b = document.getElementById("settings-backdrop");
        var m = document.getElementById("settings-modal");
        b.classList.remove("visible");
        m.classList.remove("visible");
        b.hidden = true;
        m.hidden = true;
        invoke("set_bar_height", { height: 44 });
      }

      // Switch the settings popup between its left tabs (设置 / 更新 dsh / 关于).
      function showTab(name) {
        var tabs = document.querySelectorAll(".sm-tab");
        var panels = document.querySelectorAll(".sm-panel");
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].classList.toggle("active", tabs[i].getAttribute("data-tab") === name);
        }
        for (var j = 0; j < panels.length; j++) {
          panels[j].classList.toggle("active", panels[j].getAttribute("data-panel") === name);
        }
      }

      // ---- theme selector ----
      var currentTheme = "system";
      function setThemeSeg(t) {
        currentTheme = t || "system";
        var seg = document.getElementById("theme-seg");
        if (!seg) return;
        var bs = seg.querySelectorAll("button");
        for (var i = 0; i < bs.length; i++) {
          bs[i].classList.toggle("active", bs[i].getAttribute("data-theme") === currentTheme);
        }
      }

      // Render one status line + progress bar (determinate or indeterminate)
      // for the given panel prefix ("dsh" or "about").
      function renderStatus(prefix, s, active) {
        var status = document.getElementById(prefix + "-status");
        var bar = document.getElementById(prefix + "-progress");
        if (!status || !bar) return;
        var fill = document.getElementById(prefix + "-progress-fill");
        status.textContent = s.message || "";
        // Show the progress bar while a phase is active, or mid-download.
        if (active || (s.progress != null && s.progress > 0 && s.progress < 100)) {
          bar.classList.add("visible");
          if (s.progress != null) {
            bar.classList.remove("indeterminate");
            fill.style.width = Math.max(0, Math.min(100, s.progress)) + "%";
          } else {
            bar.classList.add("indeterminate");
            fill.style.width = "";
          }
        } else {
          bar.classList.remove("visible", "indeterminate");
          fill.style.width = "";
        }
      }

      // Render the live update/check state into both the 更新 dsh and 关于
      // panels (status line + progress bar), the release notes, and the
      // enable/disable + label of the action buttons. Driven by the
      // `update-progress` event and by `get_update_state` on popup open, so
      // closing the popup mid-update never loses the status.
      function renderUpdateState(s) {
        if (!s) return;
        var active = ["checking", "downloading", "installing", "restarting", "finalizing"].indexOf(s.phase) >= 0;
        renderStatus("dsh", s, active);
        renderStatus("about", s, active);

        var notes = document.getElementById("about-notes");
        if (s.release_notes && s.release_notes.trim()) {
          notes.textContent = s.release_notes;
          notes.hidden = false;
        } else {
          notes.hidden = true;
        }

        var checkBtn = document.getElementById("about-check");
        var upd = document.getElementById("about-update");
        checkBtn.disabled = active;
        if (s.latest && s.updateAvailable) {
          upd.textContent = "更新到 v" + s.latest;
        } else if (!active) {
          upd.textContent = "更新";
        }
        upd.disabled = active || !s.updateAvailable;

        // dsh update button is disabled while any update is in flight.
        document.getElementById("menu-update").disabled = active;
      }

      function openSettings() {
        settingsOpen = true;
        window.__settingsOpen = true;
        hideToast();
        showTab("settings");

        // Expand the bar webview first, and reveal the popup only once it has
        // actually grown (one-shot resize listener + safety timer). This
        // avoids rendering the modal clipped inside the still-44px strip
        // while the async set_bar_height IPC is in flight.
        settingsRevealHandler = function () {
          if (window.innerHeight < 100) return; // still the strip / mid-resize
          revealSettings();
        };
        window.addEventListener("resize", settingsRevealHandler);
        settingsRevealTimer = setTimeout(revealSettings, 250);
        invoke("set_bar_height", { height: -1 });

        // Load persisted settings into the toggles.
        invoke("get_settings").then(function (s) {
          if (!s) return;
          document.getElementById("opt-close-dsh").checked = !!s.closeStopsDsh;
          document.getElementById("opt-auto-update").checked = !!s.autoUpdate;
          setThemeSeg(s.theme || "system");
        }).catch(function () {});

        // About section: app version + repo, and restore any in-flight/last
        // update status.
        invoke("get_app_info").then(function (info) {
          if (info && info.version) {
            document.getElementById("about-current").textContent = info.version;
          }
          if (info && info.repo) {
            window.__aboutRepo = info.repo;
            var repoEl = document.getElementById("about-repo");
            repoEl.textContent = "github";
            repoEl.href = "https://github.com/" + info.repo;
          }
        }).catch(function () {
          document.getElementById("about-current").textContent = "未知";
        });
        invoke("get_update_state").then(renderUpdateState).catch(function () {});
      }

      function saveSettings() {
        var settings = {
          closeStopsDsh: document.getElementById("opt-close-dsh").checked,
          autoUpdate: document.getElementById("opt-auto-update").checked,
          theme: currentTheme
        };
        invoke("save_settings", { settings: settings }).catch(function (e) {
          showToast("保存设置失败:" + e);
        });
      }

      // Clicking another nav control closes the popup if open.
      function closeSettingsIfOpen() {
        if (settingsOpen) closeSettings();
      }

      document.getElementById("btn-chat").addEventListener("click", function () {
        closeSettingsIfOpen();
        setActive("chat");
        invoke("switch_to", { target: "chat" });
      });
      document.getElementById("btn-harness").addEventListener("click", function () {
        closeSettingsIfOpen();
        setActive("harness");
        invoke("switch_to", { target: "harness" });
      });
      document.getElementById("btn-more").addEventListener("click", function () {
        if (settingsOpen) { closeSettings(); } else { openSettings(); }
      });
      document.getElementById("settings-backdrop").addEventListener("click", closeSettings);
      document.getElementById("settings-close").addEventListener("click", closeSettings);
      // Left tabs switch the right content panel.
      var tabEls = document.querySelectorAll(".sm-tab");
      for (var t = 0; t < tabEls.length; t++) {
        tabEls[t].addEventListener("click", function () {
          showTab(this.getAttribute("data-tab"));
        });
      }
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && settingsOpen) closeSettings();
      });

      // ---- popup actions ----
      document.getElementById("menu-update").addEventListener("click", function () {
        // Optimistically render; the real state comes via events.
        renderUpdateState({ phase: "checking", message: "正在检查 dsh 版本…", update_available: false });
        invoke("update_dsh").catch(function (e) {
          renderUpdateState({ phase: "error", message: "dsh 更新失败:" + e, update_available: false });
        });
      });
      document.getElementById("about-repo").addEventListener("click", function (e) {
        e.preventDefault();
        var repo = window.__aboutRepo || "";
        if (repo) invoke("open_url", { url: "https://github.com/" + repo });
      });
      // Live update/check progress: the backend publishes an `update-progress`
      // event on every state change; render it even when the popup is open.
      if (T.event) {
        T.event.listen("update-progress", function (e) {
          renderUpdateState(e.payload);
        });
      }
      document.getElementById("about-check").addEventListener("click", function () {
        // Optimistically disable the button; the real state comes via events.
        renderUpdateState({ phase: "checking", message: "正在检查更新…", update_available: false });
        invoke("check_update").catch(function (e) {
          renderUpdateState({ phase: "error", message: "检查更新失败:" + e, update_available: false });
        });
      });
      document.getElementById("about-update").addEventListener("click", function () {
        renderUpdateState({ phase: "checking", message: "正在准备更新…", update_available: false });
        invoke("update_app").catch(function (e) {
          renderUpdateState({ phase: "error", message: "更新失败:" + e, update_available: false });
        });
      });

      // Settings toggles persist immediately.
      document.getElementById("opt-close-dsh").addEventListener("change", saveSettings);
      document.getElementById("opt-auto-update").addEventListener("change", saveSettings);
      var themeSeg = document.getElementById("theme-seg");
      if (themeSeg) {
        var themeBtns = themeSeg.querySelectorAll("button");
        for (var i = 0; i < themeBtns.length; i++) {
          themeBtns[i].addEventListener("click", function () {
            setThemeSeg(this.getAttribute("data-theme"));
            saveSettings();
          });
        }
      }

      document.getElementById("toast").addEventListener("click", function () {
        if (window.__toastTimer) clearTimeout(window.__toastTimer);
        this.classList.remove("visible");
        if (!settingsOpen) invoke("set_bar_height", { height: 44 });
      });

      document.getElementById("btn-min").addEventListener("click", function () {
        closeSettingsIfOpen();
        win.minimize();
      });
      document.getElementById("btn-max").addEventListener("click", function () {
        closeSettingsIfOpen();
        win.isMaximized().then(function (m) { return m ? win.unmaximize() : win.maximize(); });
      });
      document.getElementById("btn-close").addEventListener("click", function () {
        invoke("quit");
      });

      //win.maximize();
    })();
  </script>
</body>
</html>
