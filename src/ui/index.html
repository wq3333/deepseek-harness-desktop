<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Title Bar</title>
  <style>
    :root {
      --bar: #f6f8fa;
      --fg: #1f2328;
      --muted: #57606a;
      --accent: #0969da;
      --border: #d0d7de;
      --hover: rgba(31, 35, 40, 0.07);
      --active-bg: rgba(9, 105, 218, 0.10);
      --active-border: rgba(9, 105, 218, 0.35);
      --danger: #cf222e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* Transparent page background: the bar webview is stretched over the
       content area while the "更多" dropdown is open, so the page must let
       the content show through (the 44px #bar strip below stays opaque). */
    html, body {
      background: transparent;
      color: var(--fg);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ---- title bar strip (44px) ---- */
    #bar {
      position: relative;
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 0 0 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bar);
    }
    /* centered nav group: Chat, Harness, More(⋮) */
    .nav {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .nav button {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .nav button:hover { background: var(--hover); color: var(--fg); }
    .nav button.active {
      background: var(--active-bg);
      border-color: var(--active-border);
      color: var(--accent);
      font-weight: 600;
    }
    #btn-more {
      width: 28px;
      height: 28px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---- window controls: uniform 46x44, flush to the right edge ---- */
    .win-controls {
      margin-left: auto;
      display: flex;
      height: 44px;
    }
    .win-controls button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      width: 46px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .win-controls button:hover { background: var(--hover); color: var(--fg); }
    .win-controls button.close:hover { background: #e81123; color: #fff; }

    /* ---- custom "更多" dropdown (bar webview expands over content when open) ---- */
    #backdrop {
      position: fixed;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(31, 35, 40, 0.28);
      z-index: 10;
    }
    #dropdown {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(31, 35, 40, 0.16);
      z-index: 11;
      padding: 4px;
    }
    #dropdown button {
      appearance: none;
      border: 0;
      background: transparent;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--fg);
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    #dropdown button:hover { background: var(--hover); }
    #dropdown button.danger { color: var(--danger); }
    #dropdown button.danger:hover { background: rgba(207, 34, 46, 0.08); }

    /* ---- transient toast (top-right, shown by expanding the bar a bit) ---- */
    #toast {
      position: fixed;
      top: 52px;
      right: 12px;
      max-width: min(380px, calc(100vw - 24px));
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(31, 35, 40, 0.16);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--fg);
      line-height: 1.5;
      z-index: 20;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      cursor: pointer;
    }
    #toast.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

    /* ---- about dialog (bar webview expands to full window while open) ---- */
    #about-backdrop {
      position: fixed;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(31, 35, 40, 0.28);
      z-index: 25;
    }
    #about-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(440px, calc(100vw - 48px));
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(31, 35, 40, 0.20);
      z-index: 30;
      padding: 18px 20px;
      overflow: hidden;
    }
    /* `display: flex` above would otherwise defeat the hidden attribute */
    #about-modal[hidden] { display: none; }
    #about-modal h2 {
      margin: 0 0 4px;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #about-modal h2 svg { color: var(--accent); flex: none; }
    #about-sub {
      margin: 0 0 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .about-row {
      font-size: 13px;
      margin-bottom: 10px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .about-row span.value { font-weight: 600; }
    #about-status {
      font-size: 13px;
      line-height: 1.5;
      min-height: 20px;
      margin-bottom: 8px;
      color: var(--fg);
      white-space: pre-wrap;
    }
    #about-notes {
      flex: 1 1 auto;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bar);
      padding: 10px 12px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--fg);
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .about-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .about-actions button {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--fg);
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .about-actions button:hover:not(:disabled) { background: var(--hover); }
    .about-actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .about-actions button.primary:hover:not(:disabled) { background: #0a5fc0; }
    .about-actions button:disabled { opacity: 0.5; cursor: default; }

    /* repo link inside the about dialog */
    .about-row a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }
    .about-row a:hover { text-decoration: underline; }

    /* ---- about update progress bar ---- */
    #about-progress {
      display: none;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    #about-progress.visible { display: block; }
    #about-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.2s ease;
    }
    /* indeterminate mode: a short segment sliding across the track */
    #about-progress.indeterminate #about-progress-fill {
      width: 40%;
      animation: about-progress-slide 1.1s ease-in-out infinite;
    }
    @keyframes about-progress-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="bar" data-tauri-drag-region="deep">
    <div class="nav" data-tauri-drag-region="false">
      <button id="btn-chat">Chat</button>
      <button id="btn-harness" class="active">Harness</button>
      <button id="btn-more" title="更多" aria-label="更多">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <circle cx="8" cy="3.4" r="1.5" />
          <circle cx="8" cy="8" r="1.5" />
          <circle cx="8" cy="12.6" r="1.5" />
        </svg>
      </button>
    </div>
    <div class="win-controls" data-tauri-drag-region="false">
      <button id="btn-min" title="最小化" aria-label="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M1.5 6h9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
        </svg>
      </button>
      <button id="btn-max" title="最大化" aria-label="最大化">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <rect x="2" y="2" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.1" />
        </svg>
      </button>
      <button id="btn-close" class="close" title="关闭" aria-label="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.4 2.4l7.2 7.2M9.6 2.4l-7.2 7.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>

  <!-- dropdown (only visible while the bar webview is expanded) -->
  <div id="backdrop" hidden></div>
  <div id="dropdown" hidden>
    <!-- <button id="menu-stop">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
        stroke-linecap="round" aria-hidden="true">
        <rect x="3" y="3" width="10" height="10" rx="1.5" />
      </svg>
      关闭 dsh
    </button> -->
    <button id="menu-quit" class="danger">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
        <path d="M8 1.6v5.8" />
        <path d="M5.1 3.2a5.2 5.2 0 1 0 5.8 0" />
      </svg>
      关闭dsh和窗口
    </button>
    <button id="menu-restart">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
        <path d="M13.2 8A5.2 5.2 0 1 1 11.7 4.4" />
        <path d="M13.2 1.6v3h-3" />
      </svg>
      重启 dsh
    </button>
    <button id="menu-update">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
        <path d="M8 12V3" />
        <path d="M4.5 6.5 8 3l3.5 3.5" />
        <path d="M3 13h10" />
      </svg>
      更新 dsh
    </button>
    <button id="menu-about">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
        <circle cx="8" cy="8" r="5.6" />
        <path d="M8 7.2v3.2" />
        <path d="M8 5v.1" />
      </svg>
      关于
    </button>
  </div>

  <!-- about dialog -->
  <div id="about-backdrop" hidden></div>
  <div id="about-modal" hidden>
    <h2>
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="9" rx="1.5" />
        <path d="M5 14.5h6" />
        <path d="M8 11.5v3" />
      </svg>
      DeepSeek Harness Desktop
    </h2>
    <p id="about-sub">DeepSeek Harness 原生桌面壳(Tauri)</p>
    <div class="about-row">当前版本:<span class="value" id="about-current">…</span></div>
    <div class="about-row">仓库:<a id="about-repo" href="#">…</a></div>
    <div id="about-status"></div>
    <div id="about-progress"><div id="about-progress-fill"></div></div>
    <div id="about-notes" hidden></div>
    <div class="about-actions">
      <button id="about-check" class="primary">检查更新</button>
      <button id="about-update" disabled>更新</button>
      <button id="about-close">关闭</button>
    </div>
  </div>

  <!-- transient toast -->
  <div id="toast"></div>

  <script>
    // Keep the single title bar's active-button highlight in sync. Called on
    // load and by the Rust side (bar.eval("setActive('...')")) after a switch.
    function setActive(target) {
      var h = document.getElementById("btn-harness");
      var c = document.getElementById("btn-chat");
      if (h) h.classList.toggle("active", target === "harness");
      if (c) c.classList.toggle("active", target === "chat");
    }

    // Show a transient toast. Called by the Rust side
    // (bar.eval("showToast('...')")) after operations complete; expands the
    // bar webview a little so the card renders below the 44px strip, then
    // auto-dismisses and shrinks it back.
    function showToast(text, ms) {
      var el = document.getElementById("toast");
      var dur = ms || 3500;
      if (!el) return;
      el.textContent = text;
      el.classList.add("visible");
      var T = window.__TAURI__;
      if (T) T.core.invoke("set_bar_height", { height: 150 });
      if (window.__toastTimer) clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () {
        el.classList.remove("visible");
        if (T) T.core.invoke("set_bar_height", { height: 44 });
      }, dur);
    }

    (function () {
      var T = window.__TAURI__;
      if (!T) return;
      // 初始高亮:标题栏 webview 由 Rust 注入 window.__DSH_TARGET__(现恒为 harness)
      setActive(window.__DSH_TARGET__ || "harness");

      function invoke(cmd, args) { return T.core.invoke(cmd, args || {}); }
      var win = T.window.getCurrentWindow();

      // ---- custom "更多" dropdown ----
      var menuOpen = false;
      function hideToast() {
        var el = document.getElementById("toast");
        if (window.__toastTimer) clearTimeout(window.__toastTimer);
        if (el) el.classList.remove("visible");
        invoke("set_bar_height", { height: 44 });
      }
      function showMenu() {
        menuOpen = true;
        hideToast();
        document.getElementById("dropdown").hidden = false;
        document.getElementById("backdrop").hidden = false;
        invoke("set_bar_height", { height: -1 });
      }
      function hideMenu() {
        menuOpen = false;
        document.getElementById("dropdown").hidden = true;
        document.getElementById("backdrop").hidden = true;
        invoke("set_bar_height", { height: 44 });
      }

      // ---- about dialog (expands the bar webview over the content) ----
      var aboutOpen = false;

      // Render the live update/check state into the About dialog: status line,
      // progress bar (determinate or indeterminate), release notes and the
      // enable/disable + label of the check/update buttons. Driven by the
      // `update-progress` event and by `get_update_state` on dialog open, so
      // closing the dialog mid-update never loses the status.
      function renderUpdateState(s) {
        if (!s) return;
        var status = document.getElementById("about-status");
        var bar = document.getElementById("about-progress");
        var fill = document.getElementById("about-progress-fill");
        var notes = document.getElementById("about-notes");
        var checkBtn = document.getElementById("about-check");
        var upd = document.getElementById("about-update");
        var active = ["checking", "downloading", "installing", "restarting", "finalizing"].indexOf(s.phase) >= 0;

        status.textContent = s.message || "";

        // Show the progress bar while a phase is active, or mid-download.
        if (active || (s.progress != null && s.progress > 0 && s.progress < 100)) {
          bar.classList.add("visible");
          if (s.progress != null) {
            bar.classList.remove("indeterminate");
            fill.style.width = Math.max(0, Math.min(100, s.progress)) + "%";
          } else {
            bar.classList.add("indeterminate");
            fill.style.width = "";
          }
        } else {
          bar.classList.remove("visible", "indeterminate");
          fill.style.width = "";
        }

        if (s.release_notes && s.release_notes.trim()) {
          notes.textContent = s.release_notes;
          notes.hidden = false;
        } else {
          notes.hidden = true;
        }

        checkBtn.disabled = active;
        if (s.latest && s.updateAvailable) {
          upd.textContent = "更新到 v" + s.latest;
        } else if (!active) {
          upd.textContent = "更新";
        }
        upd.disabled = active || !s.updateAvailable;
      }

      function showAbout() {
        aboutOpen = true;
        hideMenu();
        hideToast();
        document.getElementById("about-backdrop").hidden = false;
        document.getElementById("about-modal").hidden = false;
        invoke("set_bar_height", { height: -1 });
        invoke("get_app_info").then(function (info) {
          if (info && info.version) {
            document.getElementById("about-current").textContent = info.version;
          }
          if (info && info.repo) {
            window.__aboutRepo = info.repo;
            var repoEl = document.getElementById("about-repo");
            repoEl.textContent = "github";
            repoEl.href = "https://github.com/" + info.repo;
          }
        }).catch(function () {
          document.getElementById("about-current").textContent = "未知";
        });
        // Restore any in-flight / last update status (item 3: keep state
        // across dialog close/reopen).
        invoke("get_update_state").then(renderUpdateState).catch(function () {});
      }
      function hideAbout() {
        aboutOpen = false;
        document.getElementById("about-backdrop").hidden = true;
        document.getElementById("about-modal").hidden = true;
        invoke("set_bar_height", { height: 44 });
      }

      // Clicking another nav menu closes the "更多" dropdown / about if open.
      document.getElementById("btn-chat").addEventListener("click", function () {
        if (aboutOpen) hideAbout();
        if (menuOpen) hideMenu();
        setActive("chat");
        invoke("switch_to", { target: "chat" });
      });
      document.getElementById("btn-harness").addEventListener("click", function () {
        if (aboutOpen) hideAbout();
        if (menuOpen) hideMenu();
        setActive("harness");
        invoke("switch_to", { target: "harness" });
      });
      document.getElementById("btn-more").addEventListener("click", function () {
        if (aboutOpen) hideAbout();
        if (menuOpen) { hideMenu(); } else { showMenu(); }
      });
      document.getElementById("backdrop").addEventListener("click", hideMenu);
      document.getElementById("about-backdrop").addEventListener("click", hideAbout);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (aboutOpen) hideAbout();
          else if (menuOpen) hideMenu();
        }
      });
      // document.getElementById("menu-stop").addEventListener("click", function () {
      //   hideMenu();
      //   invoke("stop_dsh");
      // });
      document.getElementById("menu-quit").addEventListener("click", function () {
        hideMenu();
        invoke("quit_with_dsh");
      });
      document.getElementById("menu-restart").addEventListener("click", function () {
        hideMenu();
        invoke("restart_dsh");
      });
      document.getElementById("menu-update").addEventListener("click", function () {
        hideMenu();
        invoke("update_dsh");
      });
      document.getElementById("menu-about").addEventListener("click", function () {
        showAbout();
      });

      // ---- about dialog actions ----
      document.getElementById("about-close").addEventListener("click", hideAbout);
      document.getElementById("about-repo").addEventListener("click", function (e) {
        e.preventDefault();
        var repo = window.__aboutRepo || "";
        if (repo) invoke("open_url", { url: "https://github.com/" + repo });
      });
      // Live update/check progress: the backend publishes an `update-progress`
      // event on every state change; render it even when the dialog is open.
      if (T.event) {
        T.event.listen("update-progress", function (e) {
          renderUpdateState(e.payload);
        });
      }
      document.getElementById("about-check").addEventListener("click", function () {
        // Optimistically disable the button; the real state comes via events.
        renderUpdateState({ phase: "checking", message: "正在检查更新…", update_available: false });
        invoke("check_update").catch(function (e) {
          renderUpdateState({ phase: "error", message: "检查更新失败:" + e, update_available: false });
        });
      });
      document.getElementById("about-update").addEventListener("click", function () {
        renderUpdateState({ phase: "checking", message: "正在准备更新…", update_available: false });
        invoke("update_app").catch(function (e) {
          renderUpdateState({ phase: "error", message: "更新失败:" + e, update_available: false });
        });
      });

      document.getElementById("toast").addEventListener("click", function () {
        if (window.__toastTimer) clearTimeout(window.__toastTimer);
        this.classList.remove("visible");
        invoke("set_bar_height", { height: 44 });
      });

      document.getElementById("btn-min").addEventListener("click", function () {
        if (aboutOpen) hideAbout();
        if (menuOpen) hideMenu();
        win.minimize();
      });
      document.getElementById("btn-max").addEventListener("click", function () {
        if (aboutOpen) hideAbout();
        if (menuOpen) hideMenu();
        win.isMaximized().then(function (m) { return m ? win.unmaximize() : win.maximize(); });
      });
      document.getElementById("btn-close").addEventListener("click", function () {
        invoke("quit");
      });

      win.maximize();
    })();
  </script>
</body>
</html>
