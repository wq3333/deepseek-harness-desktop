<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Title Bar</title>
  <style>
    :root {
      --bar: #f6f8fa;
      --fg: #1f2328;
      --muted: #57606a;
      --accent: #0969da;
      --accent-hover: #0a5fc0;
      --border: #d0d7de;
      --hover: rgba(31, 35, 40, 0.07);
      --active-bg: rgba(9, 105, 218, 0.10);
      --active-border: rgba(9, 105, 218, 0.35);
      --danger: #cf222e;
      --ok: #1a7f37;
      --card: #ffffff;
    }

    /* Dark palette, applied by the Rust side via data-dsh-theme on <html> */
    html[data-dsh-theme="dark"] {
      --bar: #161b22;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --border: #30363d;
      --hover: rgba(230, 237, 243, 0.08);
      --active-bg: rgba(88, 166, 255, 0.15);
      --active-border: rgba(88, 166, 255, 0.40);
      --danger: #f85149;
      --ok: #3fb950;
      --card: #0d1117;
    }

    html[data-dsh-theme="dark"] #settings-backdrop {
      background: rgba(0, 0, 0, 0.60);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    /* Transparent page background: the bar webview is stretched over the
       content area while the settings popup is open, so the page must let
       the content show through (the 44px #bar strip below stays opaque). */
    html,
    body {
      background: transparent;
      color: var(--fg);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ---- title bar strip (44px) ---- */
    #bar {
      position: relative;
      display: flex;
      align-items: center;
      height: 44px;
      border-bottom: 1px solid var(--border);
      background: var(--bar);
    }

    .nav {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .nav button {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .nav button:hover {
      background: var(--hover);
      color: var(--fg);
    }

    .nav button.active {
      background: var(--active-bg);
      border-color: var(--active-border);
      color: var(--accent);
      font-weight: 600;
    }

    #btn-settings {
      width: 28px;
      height: 28px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* the settings gear mark (entry button + popup header share one family) */
    .gear {
      display: block;
    }

    /* ---- window controls: uniform 46x44, flush to the right edge ---- */
    .win-controls {
      margin-left: auto;
      display: flex;
      height: 44px;
    }

    .win-controls button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      width: 46px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .win-controls button:hover {
      background: var(--hover);
      color: var(--fg);
    }

    .win-controls button.close:hover {
      background: #e81123;
      color: #fff;
    }

    /* ---- settings popup (bar webview expands over content while open) ---- */
    #settings-backdrop {
      position: fixed;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(31, 35, 40, 0.1);
      z-index: 25;
      /* Fade in only after the bar webview has grown; see openSettings() */
      opacity: 0;
      /* No opacity transition: the dim layer is nearly invisible (alpha 0.1)
         and animating a full-viewport layer frame-by-frame inside the
         transparent bar webview is exactly what made closing the popup
         stutter. It snaps; only the modal fades. */
    }

    #settings-backdrop.visible {
      opacity: 1;
    }

    #settings-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% + 8px)) scale(0.97);
      width: min(560px, calc(100vw - 48px));
      height: min(350px, calc(100vh - 120px));
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 32px var(--muted);
      z-index: 30;
      padding: 16px 22px 18px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    #settings-modal.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* `display: flex` above would otherwise defeat the hidden attribute */
    #settings-modal[hidden] {
      display: none;
    }

    .sm-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .sm-head h2 {
      margin: 0;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sm-head h2 svg {
      color: var(--accent);
      flex: none;
    }

    #settings-close {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      width: 26px;
      height: 26px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #settings-close:hover {
      background: var(--hover);
      color: var(--fg);
    }

    /* two-pane layout: left tabs / right content */
    .sm-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      gap: 16px;
    }

    .sm-tabs {
      flex: none;
      width: 120px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 14px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    .sm-tab {
      appearance: none;
      border: 0;
      background: transparent;
      text-align: left;
      font-size: 13px;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .sm-tab:hover {
      background: var(--hover);
      color: var(--fg);
    }

    .sm-tab.active {
      background: var(--active-bg);
      color: var(--accent);
      font-weight: 600;
    }

    .sm-panels {
      flex: 1 1 auto;
      min-width: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    .sm-panel {
      display: none;
    }

    .sm-panel.active {
      display: block;
    }

    .opt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--fg);
    }

    .opt-row:hover {
      background: var(--hover);
    }

    .opt-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      flex: none;
    }

    /* segmented control (theme selector) */
    .seg {
      display: flex;
      flex: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .seg button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .seg button:hover {
      background: var(--hover);
      color: var(--fg);
    }

    .seg button.active {
      background: var(--active-bg);
      color: var(--accent);
      font-weight: 600;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 600;
      margin: 2px 0 10px;
    }

    /* ---- transient toast (top-right, shown by expanding the bar a bit) ---- */
    #toast {
      position: fixed;
      top: 52px;
      right: 12px;
      max-width: min(380px, calc(100vw - 24px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px var(--muted);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--fg);
      line-height: 1.5;
      z-index: 40;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      cursor: pointer;
    }

    #toast.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ---- about section inside the settings popup ---- */
    /* one card per target (dsh / 桌面版): name + version on the left,
       per-target update button on the right (shown only when an update exists) */
    .about-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bar);
      margin-bottom: 4px;
    }

    .ai-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .ai-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      flex: none;
    }

    .ai-ver {
      font-size: 12.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .ai-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: 12.5px;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      flex: none;
      white-space: nowrap;
    }

    .ai-btn:hover:not(:disabled) {
      background: var(--hover);
    }

    .ai-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .ai-btn.primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .ai-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .ai-btn[hidden] {
      display: none;
    }

    /* right-side action cluster of each about card (检查更新 + 更新) */
    .ai-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
      min-width: 0;
    }

    .ai-status {
      font-size: 12px;
      line-height: 1.5;
      min-height: 18px;
      margin: 2px 0 8px;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .ai-status.ok {
      color: var(--ok);
    }

    .ai-status.new {
      color: var(--accent);
    }

    .ai-status.err {
      color: var(--danger);
    }

    /* repo link + release notes */
    .about-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      margin: 6px 0 12px;
    }

    .about-row a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }

    .about-row a:hover {
      text-decoration: underline;
    }

    .about-notes {
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bar);
      padding: 10px 12px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--fg);
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ---- per-target progress bar (dsh + 桌面版 cards) ---- */
    .about-progress {
      display: none;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 0 10px;
    }

    .about-progress.visible {
      display: block;
    }

    .about-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.2s ease;
    }

    /* indeterminate mode: a short segment sliding across the track */
    .about-progress.indeterminate .about-progress-fill {
      width: 40%;
      animation: about-progress-slide 1.1s ease-in-out infinite;
    }

    @keyframes about-progress-slide {
      0% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(260%);
      }
    }

    /* NOTE: there is deliberately NO @media (prefers-reduced-motion) override
       that sets transition: none for the popup. Windows reports
       prefers-reduced-motion: reduce when the OS-level "show animations"
       setting is off, and that override used to silently kill the popup
       open/close fade here. The popup transitions are short and low-impact,
       and the user explicitly asked for them to work, so they always run. */
  </style>
</head>

<body>
  <div id="bar" data-tauri-drag-region="deep">
    <div class="nav" data-tauri-drag-region="false">
      <button id="btn-chat">Chat</button>
      <button id="btn-harness" class="active">Harness</button>
      <button id="btn-settings" title="设置" aria-label="设置">
        <svg class="gear" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- gear: 8 teeth + rim + hub (stroke-width: teeth 1.9, rim/hub 1.2) -->
          <path stroke-width="1.9"
            d="M12.6 8L14.8 8M11.25 11.25L12.81 12.81M8 12.6L8 14.8M4.75 11.25L3.19 12.81M3.4 8L1.2 8M4.75 4.75L3.19 3.19M8 3.4L8 1.2M11.25 4.75L12.81 3.19" />
          <circle cx="8" cy="8" r="4.7" stroke-width="1.2" />
          <circle cx="8" cy="8" r="2.2" stroke-width="1.2" />
        </svg>
      </button>
    </div>
    <div class="win-controls" data-tauri-drag-region="false">
      <button id="btn-min" title="最小化" aria-label="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M1.5 6h9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
        </svg>
      </button>
      <button id="btn-max" title="最大化" aria-label="最大化">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <rect x="2" y="2" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.1" />
        </svg>
      </button>
      <button id="btn-close" class="close" title="关闭" aria-label="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.4 2.4l7.2 7.2M9.6 2.4l-7.2 7.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>

  <!-- settings popup (only visible while the bar webview is expanded) -->
  <div id="settings-backdrop" hidden></div>
  <div id="settings-modal" hidden>
    <div class="sm-head">
      <h2>
        <svg class="gear" width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="currentColor"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path stroke-width="1.9"
            d="M12.6 8L14.8 8M11.25 11.25L12.81 12.81M8 12.6L8 14.8M4.75 11.25L3.19 12.81M3.4 8L1.2 8M4.75 4.75L3.19 3.19M8 3.4L8 1.2M11.25 4.75L12.81 3.19" />
          <circle cx="8" cy="8" r="4.7" stroke-width="1.2" />
          <circle cx="8" cy="8" r="2.2" stroke-width="1.2" />
        </svg>
      </h2>
      <button id="settings-close" title="关闭" aria-label="关闭">✕</button>
    </div>

    <div class="sm-body">
      <div class="sm-tabs">
        <button class="sm-tab active" data-tab="settings">设置</button>
        <button class="sm-tab" data-tab="about">关于</button>
      </div>
      <div class="sm-panels">
        <div class="sm-panel active" data-panel="settings">
          <label class="opt-row">
            <span class="opt-label">关闭窗口时关闭 dsh 服务</span>
            <input type="checkbox" id="opt-close-dsh" />
          </label>
          <label class="opt-row">
            <span class="opt-label">自动更新</span>
            <input type="checkbox" id="opt-auto-update" />
          </label>
          <div class="opt-row">
            <span class="opt-label">主题</span>
            <div class="seg" id="theme-seg">
              <button type="button" data-theme="light">浅色</button>
              <button type="button" data-theme="dark">深色</button>
              <button type="button" data-theme="system" class="active">跟随系统</button>
            </div>
          </div>
        </div>

        <div class="sm-panel" data-panel="about">
          <!-- dsh card: current version + check status + per-target actions.
               Each card has its own 检查更新 (checks only this target) and a
               更新 button that appears only when an update is available. -->
          <div class="about-item">
            <div class="ai-left">
              <span class="ai-name">dsh</span>
              <span class="ai-ver" id="ver-dsh">…</span>
            </div>
            <div class="ai-actions">
              <button class="ai-btn" id="chk-dsh" title="检查 dsh 更新">检查更新</button>
              <button class="ai-btn primary" id="upd-dsh" hidden>更新 dsh</button>
            </div>
          </div>
          <div class="ai-status" id="status-dsh"></div>
          <div class="about-progress" id="prog-dsh">
            <div class="about-progress-fill" id="fill-dsh"></div>
          </div>

          <!-- desktop app card -->
          <div class="about-item">
            <div class="ai-left">
              <span class="ai-name">桌面版</span>
              <span class="ai-ver" id="ver-app">…</span>
            </div>
            <div class="ai-actions">
              <button class="ai-btn" id="chk-app" title="检查桌面版更新">检查更新</button>
              <button class="ai-btn primary" id="upd-app" hidden>更新桌面版</button>
            </div>
          </div>
          <div class="ai-status" id="status-app"></div>
          <div class="about-progress" id="prog-app">
            <div class="about-progress-fill" id="fill-app"></div>
          </div>

          <div class="about-row">仓库:<a id="about-repo" href="#">…</a></div>
          <div id="about-notes" class="about-notes" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <!-- transient toast -->
  <div id="toast"></div>

  <script>
    // Keep the single title bar's active-button highlight in sync. Called on
    // load and by the Rust side (bar.eval("setActive('...')")) after a switch.
    function setActive(target) {
      var h = document.getElementById("btn-harness");
      var c = document.getElementById("btn-chat");
      if (h) h.classList.toggle("active", target === "harness");
      if (c) c.classList.toggle("active", target === "chat");
    }

    // Show a transient toast. Called by the Rust side
    // (bar.eval("showToast('...')")) after operations complete; expands the
    // bar webview a little so the card renders below the 44px strip, then
    // auto-dismisses and shrinks it back. While the settings popup is open
    // (bar already expanded to the full window) the bar is left untouched.
    function showToast(text, ms) {
      var el = document.getElementById("toast");
      var dur = ms || 3500;
      if (!el) return;
      el.textContent = text;
      el.classList.add("visible");
      var T = window.__TAURI__;
      var expanded = !!window.__settingsOpen;
      if (T && !expanded) T.core.invoke("set_bar_height", { height: 150 });
      if (window.__toastTimer) clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () {
        el.classList.remove("visible");
        if (T && !expanded) T.core.invoke("set_bar_height", { height: 44 });
      }, dur);
    }

    (function () {
      var T = window.__TAURI__;
      if (!T) return;
      // 初始高亮:标题栏 webview 由 Rust 注入 window.__DSH_TARGET__(现恒为 harness)
      setActive(window.__DSH_TARGET__ || "harness");

      function invoke(cmd, args) { return T.core.invoke(cmd, args || {}); }
      var win = T.window.getCurrentWindow();

      // ---- settings popup (replaces the old 更多 dropdown + about dialog) ----
      // Fallback hide delay (ms): should be longer than the CSS opacity
      // transition so closeSettings hides the popup after the fade-out has
      // finished even if the transitionend event never fires.
      var SETTINGS_FADE_MS = 150;
      var settingsOpen = false;
      window.__settingsOpen = false; // read by showToast to avoid resizing
      // Pending popup reveal: the popup is shown only after the bar webview
      // has actually grown to full height (see openSettings/revealSettings).
      var settingsRevealTimer = null;
      var settingsRevealHandler = null;
      // Pending popup hide: runs after the fade-out transition has finished.
      var settingsTransitionTimer = null;
      // Pending close transitionend handler (see closeSettings); removed again
      // when the popup is reopened so a stale close can never hide a re-opened
      // popup after its open transition finishes.
      var settingsCloseHandler = null;

      function cancelSettingsReveal() {
        if (settingsRevealTimer) { clearTimeout(settingsRevealTimer); settingsRevealTimer = null; }
        if (settingsRevealHandler) {
          window.removeEventListener("resize", settingsRevealHandler);
          settingsRevealHandler = null;
        }
      }

      // Make the popup visible and fade it in. Revealing earlier — while the
      // bar webview is still 44px tall — paints the modal clipped at the top
      // for a frame or two and then jumps it to center (the open "flash").
      // The forced reflow between unhiding and adding .visible matters: without
      // it the browser coalesces both style changes into one paint, so the
      // start state (opacity 0 / scaled position) is never actually rendered
      // and the CSS transition is skipped (the popup just pops in).
      function revealSettings() {
        cancelSettingsReveal();
        var b = document.getElementById("settings-backdrop");
        var m = document.getElementById("settings-modal");
        // A close fade may still be in flight if we reopen quickly; its
        // transitionend handler must not hide this freshly re-opened popup.
        if (settingsCloseHandler) {
          m.removeEventListener("transitionend", settingsCloseHandler);
          settingsCloseHandler = null;
        }
        b.hidden = false;
        m.hidden = false;
        void b.offsetHeight; // commit the transition start state before...
        void m.offsetHeight; // ...adding .visible, so the fade/scale runs
        b.classList.add("visible");
        m.classList.add("visible");
      }

      function hideToast() {
        var el = document.getElementById("toast");
        if (window.__toastTimer) clearTimeout(window.__toastTimer);
        if (el) el.classList.remove("visible");
        if (!settingsOpen) invoke("set_bar_height", { height: 44 });
      }
      function closeSettings() {
        if (!settingsOpen) return;
        cancelSettingsReveal();
        if (settingsTransitionTimer) { clearTimeout(settingsTransitionTimer); settingsTransitionTimer = null; }
        settingsOpen = false;
        window.__settingsOpen = false;
        var b = document.getElementById("settings-backdrop");
        var m = document.getElementById("settings-modal");
        b.classList.remove("visible");
        m.classList.remove("visible");
        // Hide the popup and shrink the bar webview only after the fade-out
        // transition has actually finished, so the close fades out instead of
        // vanishing in a single frame. transitionend is the authoritative
        // signal; a slightly longer fallback timer covers the case where no
        // transition runs at all (element already hidden / transitions off).
        var finishHide = function () {
          if (settingsCloseHandler) {
            m.removeEventListener("transitionend", settingsCloseHandler);
            settingsCloseHandler = null;
          }
          if (settingsTransitionTimer) { clearTimeout(settingsTransitionTimer); settingsTransitionTimer = null; }
          b.hidden = true;
          m.hidden = true;
          invoke("set_bar_height", { height: 44 });
        };
        settingsCloseHandler = function handler(e) {
          if (e.target === m && e.propertyName === "opacity") {
            m.removeEventListener("transitionend", handler);
            settingsCloseHandler = null;
            finishHide();
          }
        };
        m.addEventListener("transitionend", settingsCloseHandler);
        settingsTransitionTimer = setTimeout(finishHide, SETTINGS_FADE_MS + 60);
      }

      // Switch the settings popup between its left tabs (设置 / 关于).
      function showTab(name) {
        var tabs = document.querySelectorAll(".sm-tab");
        var panels = document.querySelectorAll(".sm-panel");
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].classList.toggle("active", tabs[i].getAttribute("data-tab") === name);
        }
        for (var j = 0; j < panels.length; j++) {
          panels[j].classList.toggle("active", panels[j].getAttribute("data-panel") === name);
        }
      }

      // ---- theme selector ----
      var currentTheme = "system";
      function setThemeSeg(t) {
        currentTheme = t || "system";
        var seg = document.getElementById("theme-seg");
        if (!seg) return;
        var bs = seg.querySelectorAll("button");
        for (var i = 0; i < bs.length; i++) {
          bs[i].classList.toggle("active", bs[i].getAttribute("data-theme") === currentTheme);
        }
      }

      // Phases that keep a target busy (drive the progress bar + disable that
      // target's 检查更新/更新 buttons while any of them is in flight).
      var ACTIVE_PHASES = ["checking", "downloading", "installing", "restarting", "finalizing"];

      // Fill a version cell ("vX.Y.Z", or 未安装 when the value is missing).
      function setVersion(key, v) {
        var el = document.getElementById("ver-" + key);
        if (!el) return;
        el.textContent = v ? "v" + v : "未安装";
      }

      // Render one target card ("dsh" or "app"): version cell, status line,
      // progress bar, the per-target 检查更新 button and the update button.
      function renderTarget(key, t) {
        if (!t) return;
        var ver = document.getElementById("ver-" + key);
        var status = document.getElementById("status-" + key);
        var prog = document.getElementById("prog-" + key);
        var fill = document.getElementById("fill-" + key);
        var upd = document.getElementById("upd-" + key);
        var chk = document.getElementById("chk-" + key);
        var active = ACTIVE_PHASES.indexOf(t.phase) >= 0;

        // The version cell shows the CURRENT version only (the latest version
        // is communicated by the status line); keep whatever get_app_info set
        // while it is still unknown.
        if (ver && t.current) ver.textContent = "v" + t.current;

        status.textContent = t.message || "";
        status.classList.toggle("err", t.phase === "error");
        status.classList.toggle("new", t.phase === "done" && !!t.updateAvailable);
        status.classList.toggle("ok", t.phase === "done" && !t.updateAvailable);

        // Progress bar: visible while a phase is active, or mid-download.
        if (active || (t.progress != null && t.progress > 0 && t.progress < 100)) {
          prog.classList.add("visible");
          if (t.progress != null) {
            prog.classList.remove("indeterminate");
            fill.style.width = Math.max(0, Math.min(100, t.progress)) + "%";
          } else {
            prog.classList.add("indeterminate");
            fill.style.width = "";
          }
        } else {
          prog.classList.remove("visible", "indeterminate");
          fill.style.width = "";
        }

        // Per-target 检查更新 button: disabled while this target is busy.
        if (chk) chk.disabled = active;
        // Per-target update button: shown only when an update is available.
        upd.hidden = !(t.updateAvailable && !active);
        upd.disabled = active;
      }

      // Render the live per-target state of the 关于 panel (two cards: dsh and
      // 桌面版) plus the release notes. Driven by the `about-progress` event and
      // by `get_about_state` on popup open, so closing the popup mid-check or
      // mid-update never loses the status. Each card's buttons are managed by
      // renderTarget.
      function renderAbout(st) {
        if (!st) return;
        renderTarget("dsh", st.dsh);
        renderTarget("app", st.app);

        var notes = document.getElementById("about-notes");
        var app = st.app || {};
        if (app.releaseNotes && app.releaseNotes.trim()) {
          notes.textContent = app.releaseNotes;
          notes.hidden = false;
        } else {
          notes.hidden = true;
        }
      }

      function openSettings() {
        settingsOpen = true;
        window.__settingsOpen = true;
        hideToast();
        showTab("settings");
        // Cancel any pending fade-out hide so a quick reopen works smoothly.
        if (settingsTransitionTimer) { clearTimeout(settingsTransitionTimer); settingsTransitionTimer = null; }

        // Expand the bar webview first, and reveal the popup only once it has
        // actually grown (one-shot resize listener + safety timer). This
        // avoids rendering the modal clipped inside the still-44px strip
        // while the async set_bar_height IPC is in flight.
        settingsRevealHandler = function () {
          if (window.innerHeight < 100) return; // still the strip / mid-resize
          revealSettings();
        };
        window.addEventListener("resize", settingsRevealHandler);
        settingsRevealTimer = setTimeout(revealSettings, 250);
        invoke("set_bar_height", { height: -1 });

        // Load persisted settings into the toggles.
        invoke("get_settings").then(function (s) {
          if (!s) return;
          document.getElementById("opt-close-dsh").checked = !!s.closeStopsDsh;
          document.getElementById("opt-auto-update").checked = !!s.autoUpdate;
          setThemeSeg(s.theme || "system");
        }).catch(function () { });

        // 关于 section: current versions (desktop + dsh) + repo, and restore
        // any in-flight/last check/update status.
        invoke("get_app_info").then(function (info) {
          if (info) {
            setVersion("app", info.version);
            // dshVersion (camelCase) is the current contract; keep the
            // snake_case fallback for older builds of the backend.
            setVersion("dsh", info.dshVersion || info.dsh_version || null);
            if (info.repo) {
              window.__aboutRepo = info.repo;
              var repoEl = document.getElementById("about-repo");
              repoEl.textContent = "github";
              repoEl.href = "https://github.com/" + info.repo;
            }
          }
        }).catch(function () {
          setVersion("app", null);
        });
        invoke("get_about_state").then(renderAbout).catch(function () { });
      }

      function saveSettings() {
        var settings = {
          closeStopsDsh: document.getElementById("opt-close-dsh").checked,
          autoUpdate: document.getElementById("opt-auto-update").checked,
          theme: currentTheme
        };
        invoke("save_settings", { settings: settings }).catch(function (e) {
          showToast("保存设置失败:" + e);
        });
      }

      // Clicking another nav control closes the popup if open.
      function closeSettingsIfOpen() {
        if (settingsOpen) closeSettings();
      }

      document.getElementById("btn-chat").addEventListener("click", function () {
        closeSettingsIfOpen();
        setActive("chat");
        invoke("switch_to", { target: "chat" });
      });
      document.getElementById("btn-harness").addEventListener("click", function () {
        closeSettingsIfOpen();
        setActive("harness");
        invoke("switch_to", { target: "harness" });
      });
      document.getElementById("btn-settings").addEventListener("click", function () {
        if (settingsOpen) { closeSettings(); } else { openSettings(); }
      });
      // Clicking outside the panel (the dimmed backdrop) intentionally does NOT
      // close it: only ✕ / Esc / nav switch / window controls dismiss the panel.
      document.getElementById("settings-close").addEventListener("click", closeSettings);
      // Left tabs switch the right content panel.
      var tabEls = document.querySelectorAll(".sm-tab");
      for (var t = 0; t < tabEls.length; t++) {
        tabEls[t].addEventListener("click", function () {
          showTab(this.getAttribute("data-tab"));
        });
      }
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && settingsOpen) closeSettings();
      });

      // ---- popup actions ----
      document.getElementById("about-repo").addEventListener("click", function (e) {
        e.preventDefault();
        var repo = window.__aboutRepo || "";
        if (repo) invoke("open_url", { url: "https://github.com/" + repo });
      });
      // Live check/update progress: the backend publishes an `about-progress`
      // event on every state change; render it even when the popup is open.
      if (T.event) {
        T.event.listen("about-progress", function (e) {
          renderAbout(e.payload);
        });
      }
      // Per-target 检查更新 buttons: each card checks only its own target, so
      // dsh and the desktop app can be checked (and updated) independently.
      document.getElementById("chk-dsh").addEventListener("click", function () {
        // Optimistically render; the real state comes via events.
        renderTarget("dsh", { phase: "checking", message: "正在检查 dsh 更新…" });
        invoke("check_updates", { target: "dsh" }).catch(function (e) {
          renderTarget("dsh", { phase: "error", message: "检查 dsh 更新失败:" + e });
        });
      });
      document.getElementById("chk-app").addEventListener("click", function () {
        // Optimistically render; the real state comes via events.
        renderTarget("app", { phase: "checking", message: "正在检查桌面版更新…" });
        invoke("check_updates", { target: "app" }).catch(function (e) {
          renderTarget("app", { phase: "error", message: "检查桌面版更新失败:" + e });
        });
      });
      // Per-target update buttons (shown only when an update is available).
      document.getElementById("upd-dsh").addEventListener("click", function () {
        renderTarget("dsh", { phase: "checking", message: "正在准备更新 dsh…", updateAvailable: false });
        invoke("update_dsh").catch(function (e) {
          renderTarget("dsh", { phase: "error", message: "dsh 更新失败:" + e, updateAvailable: false });
        });
      });
      document.getElementById("upd-app").addEventListener("click", function () {
        renderTarget("app", { phase: "checking", message: "正在获取版本信息…", updateAvailable: false });
        invoke("update_app").catch(function (e) {
          renderTarget("app", { phase: "error", message: "更新桌面版失败:" + e, updateAvailable: false });
        });
      });

      // Settings toggles persist immediately.
      document.getElementById("opt-close-dsh").addEventListener("change", saveSettings);
      document.getElementById("opt-auto-update").addEventListener("change", saveSettings);
      var themeSeg = document.getElementById("theme-seg");
      if (themeSeg) {
        var themeBtns = themeSeg.querySelectorAll("button");
        for (var i = 0; i < themeBtns.length; i++) {
          themeBtns[i].addEventListener("click", function () {
            setThemeSeg(this.getAttribute("data-theme"));
            saveSettings();
          });
        }
      }

      document.getElementById("toast").addEventListener("click", function () {
        if (window.__toastTimer) clearTimeout(window.__toastTimer);
        this.classList.remove("visible");
        if (!settingsOpen) invoke("set_bar_height", { height: 44 });
      });

      document.getElementById("btn-min").addEventListener("click", function () {
        closeSettingsIfOpen();
        win.minimize();
      });
      document.getElementById("btn-max").addEventListener("click", function () {
        closeSettingsIfOpen();
        win.isMaximized().then(function (m) { return m ? win.unmaximize() : win.maximize(); });
      });
      document.getElementById("btn-close").addEventListener("click", function () {
        invoke("quit");
      });

      //win.maximize();
    })();
  </script>
</body>

</html>
